<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="header">
    <div class="title">2048</div>
    <div class="scoreboard">
      <div class="score-box">
        <span class="score-label">SCORE</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">BEST</span>
        <span class="score-value" id="best">0</span>
      </div>
    </div>
  </header>

  <div class="board" id="board">
    <div class="board-bg" id="boardBg"></div>
    <div class="tiles" id="tiles"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <div class="overlay-title" id="overlayTitle">Game Over</div>
      <div class="overlay-score" id="overlayScore"></div>
      <button class="btn" id="restartBtn">Play Again</button>
    </div>
  </div>

  <footer class="footer">
    <span class="hint" id="hint">Swipe or use arrow keys</span>
    <button class="btn btn-sm" id="newBtn">New Game</button>
  </footer>
</div>
<script src="main.js"></script>
</body>
</html>
