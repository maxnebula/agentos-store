<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voxel World</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="blocker">
  <div id="instructions">
    <h1>Voxel World</h1>
    <p id="startHint">Tap to start</p>
    <div id=desktopKeys class="keys">
      <span>W A S D</span> Move
      <span>Space</span> Up &middot; <span>Shift</span> Down
      <span>Left Click</span> Remove &middot; <span>Right Click</span> Place
      <span>1-7</span> Select block
    </div>
    <div id=mobileKeys class="keys" style="display:none">
      Drag to look around
      <span>Buttons</span> Move &middot; <span>Tap block</span> Remove
      <span>Hold + Tap</span> Place
    </div>
  </div>
</div>
<div id="crosshair">+</div>
<div id="hotbar"></div>
<div id="block-label"></div>
<div id="info">
  <span id=fps>60</span> FPS &middot;
  <span id=blocks>0</span> blocks &middot;
  <span id=pos>0, 0, 0</span>
  <span id="mode" style="display:none"></span>
</div>
<!-- Virtual controls for mobile -->
<div id="touchControls" style="display:none">
  <div id="dpad">
    <button id="btnFwd" class="ctrl-btn">▲</button>
    <div class="dpad-row">
      <button id="btnLeft" class="ctrl-btn">◀</button>
      <button id="btnRight" class="ctrl-btn">▶</button>
    </div>
    <button id="btnBack" class="ctrl-btn">▼</button>
  </div>
  <div id="actionBtns">
    <button id="btnUp" class="ctrl-btn ctrl-sm">⬆</button>
    <button id="btnDown" class="ctrl-btn ctrl-sm">⬇</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="main.js"></script>
</body>
</html>
